apiVersion: operator.dash0.com/v1beta1
kind: Dash0Monitoring
metadata:
  name: dash0-sciety-frontend-staging
  namespace: sciety
spec:
  instrumentWorkloads:
    mode: all
    labelSelector: "app.kubernetes.io/component=frontend"
  logCollection:
    enabled: true
  filter:
    logs:
      log_records:
        - 'not (resource.attributes["k8s.deployment.name"] == "sciety--prod--frontend" or resource.attributes["k8s.deployment.name"] == "sciety--prod--ingestion")'
  eventCollection:
    enabled: true
  prometheusScraping:
    enabled: false
